name: Release

# Push a tag like v0.1.0 to build installers for all platforms and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/MultiwaveSplitter-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --locked
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/MultiwaveSplitter | Out-Null
          Copy-Item target/release/multiwave-splitter.exe dist/MultiwaveSplitter/MultiwaveSplitter.exe
          Copy-Item LICENSE dist/MultiwaveSplitter/LICENSE.txt
          Compress-Archive -Path dist/MultiwaveSplitter/* -DestinationPath dist/MultiwaveSplitter-Windows-Portable.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MultiwaveSplitter-Windows-Setup.exe
            dist/MultiwaveSplitter-Windows-Portable.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: rustup update stable && rustup default stable
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/MultiwaveSplitter-Linux-x86_64.tar.gz

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          cat > notes.md <<NOTES
          ## Download

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon + Intel) | [MultiwaveSplitter-macOS.dmg](https://github.com/${{ github.repository }}/releases/download/${TAG}/MultiwaveSplitter-macOS.dmg) |
          | Windows installer | [MultiwaveSplitter-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${TAG}/MultiwaveSplitter-Windows-Setup.exe) |
          | Windows portable | [MultiwaveSplitter-Windows-Portable.zip](https://github.com/${{ github.repository }}/releases/download/${TAG}/MultiwaveSplitter-Windows-Portable.zip) |
          | Linux x86_64 | [MultiwaveSplitter-Linux-x86_64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${TAG}/MultiwaveSplitter-Linux-x86_64.tar.gz) |

          The apps are not code-signed yet. See the [installation guide](https://github.com/${{ github.repository }}#installation) for how to open them the first time.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "Multiwave Splitter $TAG" --notes-file notes.md
          fi
