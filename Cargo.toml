[package]
name = "multiwave-splitter"
version = "0.1.1"
edition = "2021"
description = "Split multichannel WAV files into mono and stereo WAV files"
license = "GPL-3.0-or-later"
repository = "https://github.com/axelsharper/multiwave-splitter"
authors = ["axelsharper"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
eframe = "0.36.2"
rfd = "0.17.2"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe"] }
